<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quandarium</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="header">
    <div class="header-brand">
      <img class="header-logo" src="assets/logo.png" alt="Quandarium" width="48" height="45">
      <div class="header-title-wrap">
        <span class="header-title">Quandarium</span>
        <span class="header-divider"></span>
      </div>
    </div>
    <div class="header-today">
      <img src="assets/icons/calendar-days.svg" alt="" width="16" height="16">
      <span id="today-date"></span>
    </div>
  </header>
  <main id="app"></main>
  <div id="modal-root"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
